# Specifications:
# view specifications.txt

# • setMyUserName
# • getMyConversations
# • getConversation
# • sendMessage
# • forwardMessage
# • commentMessage
# • uncommentMessage
# • deleteMessage
# • addToGroup
# • leaveGroup
# • setGroupName
# • setMyPhoto
# • setGroupPhoto

# setBlahBlahBlah uses PUT because it updates the user's name, group name, user's photo, and group photo.
# this is because the resource is being updated or created at aknown URI.

# try to see wether its better to have the userID in the path or in the body of the request.

openapi: '3.0.2'
info: {
  title: WASAText,
  version: '1.0',
  description: "Sadly missed the opportunity to name it 'Wasapp'.",
  contact: {}
  }
servers:
  - url: https://wasatext.com

tags:
  - name: login
    description: Operations related to user login
  - name: user
    description: Operations related to user management
  - name: conversation
    description: Operations related to conversations
  - name: message
    description: Operations related to messages
  - name: group
    description: Operations related to groups

paths:
  /session:
    post:
      tags: ["login"]
      description : logs in the user.
      summary: User log-in
      operationId: doLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: Maria
                  minLength: 3
                  maxLength: 16
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: string
                    example: "abcdef012345"

  /user/username:
    put:
      tags: ["user"]
      description: Update user’s name
      summary: Update user’s name
      operationId: setMyUserName
      parameters:
        - name: user_id
          description: ID of the user
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                new_name:
                  type: string
                  example: "NewName"
      responses:
        '200':
          content:
            application/json:
              example:
                message: "OK"
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: Username updated successfully

  /conversations:
    get:
      tags: ["conversation"]
      description: Retrieve user's conversations
      summary: Retrieve user's conversations
      operationId: getMyConversations
      parameters:
        - name: user_id
          description: ID of the user
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      responses:
        '200':
          description: List of conversations
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    items:
                      type: object
                      properties:
                        conversation_id:
                          type: string
                        last_message:
                          type: string
                        timestamp:
                          type: string
                          format: date-time
                required:
                  - conversations

  /conversations/{conversation_id}:
    get:
      tags: ["conversation"]
      description: Retrieve a single conversation
      summary: Retrieve a single conversation
      operationId: getConversation
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Details of the conversation
          content:
            application/json:
              schema:
                type: object
                required:
                  - messages  # Explicitly require 'messages' field
                properties:
                  conversation_id:
                    type: string
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        message_id:
                          $ref: '#/components/schemas/MessageId'
                        sender:
                          type: string
                        content:
                          type: string
                        timestamp:
                          type: string
                          format: date-time
                    minItems: 0 # 'messages' can still be empty though

  /conversations/create:
    post:
      tags: ["conversation"]
      description: Create a new conversation
      summary: Create a new conversation
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                participants:
                  type: array
                  items:
                    type: string
                    example: "Maria"
                  minItems: 2
                  maxItems: 10
      responses:
        '201':
          description: Conversation created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation_id:
                    type: string
                    example: "abcdef012345"

  /conversations/message:
    post:
      tags: ["message"]
      description: Send a new message
      summary: Send a new message
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                conversation_id:
                  type: string
                content:
                  type: string
      responses:
        '201':
          # description: Message sent successfully
          # it returns the message_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_id:
                    $ref: '#/components/schemas/MessageId'
          description: Message sent successfully

  /conversations/message/{message_id}/forward:
    post:
      tags: ["message"]
      description: Forward a message
      summary: Forward a message
      operationId: forwardMessage
      parameters:
        - name: message_id
          description: ID of the message
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target_conversation_id:
                  type: string
      responses:
        '200':
        # returns the message_id of the forwarded message
        # (it basically re-sends the message with the flag "isForwarded" set on true)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_id:
                    $ref: '#/components/schemas/MessageId'
          description: Message forwarded successfully

  /conversations/message/{message_id}/comment:
    post:
      tags: ["message"]
      description: Comment on a message
      summary: Comment on a message
      operationId: commentMessage
      parameters:
        - name: message_id
          description: ID of the message
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: the object that contains the new comment for a message
              type: object
              properties:
                comment:
                  description: A valid comment for a message.
                  maxLength: 1000
                  minLength: 1
                  pattern: "^.*$" # any string
                  example: "This is a comment."
                  type: string
      responses:
        '200':
          content:
            application/json:
              example:
                message: "OK"
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: Comment added successfully

  /conversations/message/{message_id}/uncomment:
    delete:
      tags: ["message"]
      description: Remove comment from a message
      summary: Remove comment from a message
      operationId: uncommentMessage
      parameters:
        - name: message_id
          description: ID of the message
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/MessageId'
      responses:
        '200':
          content:
            application/json:
              example:
                message: "OK"
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: Comment removed successfully

  /conversations/message/{message_id}:
    delete:
      tags: ["message"]
      description: Delete a message
      summary: Delete a message
      operationId: deleteMessage
      parameters:
        - name: message_id
          description: ID of the message
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/MessageId'
      responses:
        '200':
          content:
            application/json:
              example:
                message: "OK"
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: Message deleted successfully

  /conversations/{group_id}/adduser:
    post:
      tags: ["group"]
      description: Add a user to a group
      summary: Add a user to a group
      operationId: addToGroup
      parameters:
        - name: group_id
          description: ID of the group
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/GroupId'
      requestBody:
        required: true
        content:
        # it should contain the username of the user we want to add.
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: "Maria"
                  minLength: 3
                  maxLength: 16
      responses:
        '200':
          content:
            application/json:
              example:
                message: "OK"
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: User added to group successfully

  /conversations/{group_id}/kickuser:
    delete:
      tags: ["group"]
      description: Kicks a user from a group (yourself by default)
      summary: Kicks a user from a group (yourself by default)
      operationId: leaveGroup
      parameters:
        - name: group_id
          description: ID of the group
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/GroupId'
        - name: username
          description: name of the user
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      responses:
        '200':
          content:
            application/json:
              example:
                message: "OK"
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: User left the group successfully
  /user/photo:
    put:
      tags: ["user"]
      description: Update user profile photo
      summary: Update user profile photo
      operationId: setMyPhoto
      parameters:
        - name: user_id
          description: ID of the user
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              description: the object that contains the new photo for a user
              type: object
              properties:
                photo:
                  description: A valid image file as a binary string with a maximum size of 1MB.
                  type: string
                  minLength: 1
                  maxLength: 1000000
                  format: binary
      responses:
        '200':
          content:
            application/json:
              example:
                message: "OK"
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: Profile photo updated successfully

  /conversations/{group_id}/photo:
    put:
      tags: ["group"]
      description: Update group photo
      summary: Update group photo
      operationId: setGroupPhoto
      parameters:
        - name: group_id
          description: ID of the group
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/GroupId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              description: the object that contains the new photo for a group
              type: object
              properties:
                photo:
                  description: A valid image file as a binary string with a maximum size of 1MB.
                  type: string
                  minLength: 1
                  maxLength: 1000000
                  format: binary
      responses:
        '200':
          description: Group photo updated successfully
          content:
            application/json:
              example:
                message: "OK"
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /conversations/{group_id}/name:
    put:
      tags: ["group"]
      description: Update group name
      summary: Update group name
      operationId: setGroupName
      parameters:
        - name: group_id
          description: ID of the group
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
                 $ref: '#/components/schemas/ValidName'
      responses:
        '200':
          content:
            application/json:
              example:
                message: "OK"
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: Group name updated successfully

# Security Definitions
components:
  schemas:
    MessageId:
      description: A valid message id
      type: string
      example: "abcdef012345"
      minLength: 12
      maxLength: 128
      pattern: "^[A-Za-z0-9n]*$"
    UserId:
      description: A valid user id
      type: string
      example: "abcdef012345"
      minLength: 12
      maxLength: 128
      pattern: "^[A-Za-z0-9n]*$"
    GroupId:
      description: A valid group id
      type: string
      example: "creatorUser-group1"
      minLength: 3
      maxLength: 128
      pattern: "^[A-Za-z0-9-]*$"
    ValidName:
      description: the object that contains the new name for a user or group
      type: object
      properties:
        name:
          description: A valid, pattern-checked name for a user or group.
          type: string
          minLength: 3
          maxLength: 16
          pattern: "^[A-Za-z0-9]*$"
          example: "NewName"
    SuccessResponse:
      description: a generic success response for non-get requests.
      type: object
      properties:
        message:
          description: A message indicating the success of the action
          type: string
          example: "OK"
          minLength: 2
          maxLength: 100
          pattern: "^[A-Za-z0-9 ]*$"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: UUID
security:
  - bearerAuth: []
