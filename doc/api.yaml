# Specifications:
# view specifications.txt

# • setMyUserName
# • getMyConversations
# • getConversation
# • sendMessage
# • forwardMessage
# • commentMessage
# • uncommentMessage
# • deleteMessage
# • addToGroup
# • leaveGroup
# • setGroupName
# • setMyPhoto
# • setGroupPhoto

# setBlahBlahBlah uses PUT because it updates the user's name, group name, user's photo, and group photo.
# this is because the resource is being updated or created at aknown URI.

# try to see wether its better to have the userID in the path or in the body of the request.

openapi: '3.0.2'
info: {
  title: WASAText,
  version: '1.0',
  description: "Sadly missed the opportunity to name it 'Wasapp'.",
  contact: {}
  }
servers:
  - url: https://wasatext.com

tags:
  - name: login
    description: Operations related to user login
  - name: user
    description: Operations related to user management
  - name: conversation
    description: Operations related to conversations
  - name: message
    description: Operations related to messages
  - name: group
    description: Operations related to groups

paths:
  /session:
    post:
      tags: ["login"]
      description : logs in the user.
      summary: User log-in
      operationId: doLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: Besugo
                  minLength: 3
                  maxLength: 16
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: string
                    example: "abcdef012345"

  /user/username:
    put:
      tags: ["user"]
      description: Update user’s name
      summary: Update user’s name
      operationId: setMyUserName
      parameters:
        - name: Authorization
          description: Authorization token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/AuthorizationToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: the object that contains the new name for a user
              properties:
                username:
                  type: string
                  example: "NewName"
                  
                  minLength: 1
                  maxLength: 128
      responses:
        '204':
          description: Username updated successfully

  /user/photo:
    put:
      tags: ["user"]
      description: Update user profile photo
      summary: Update user profile photo
      operationId: setMyPhoto
      parameters:
        - name: Authorization
          description: Authorization token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/AuthorizationToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: the object that contains the new photo for a user
              properties:
                photo:
                  description: A string with the link to the desired image file.
                  type: string
                  minLength: 1
                  maxLength: 1000000
      responses:
        '204':
          description: Profile photo updated successfully

  /conversations:
    get:
      tags: ["conversation"]
      description: Retrieve user's conversations
      summary: Retrieve user's conversations
      operationId: getMyConversations
      parameters:
        - name: Authorization
          description: Authorization token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/AuthorizationToken'
      responses:
        '200':
          description: List of conversations
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    example: "abcdef012345"
                  conversations:
                    type: array
                    items:
                      type: string
                      example: "1"
                    minItems: 0 # 'conversations' can still be empty though

  /conversations/info/{conversation_id}:
    get:
      tags: ["conversation"]
      description: Retrieve a single conversation
      summary: Retrieve a single conversation
      operationId: getConversation
      parameters:
        - name: conversation_id
          description: ID of the conversation
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ConversationId'
        - name: Authorization
          description: Authorization token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/AuthorizationToken'
      responses:
        '200':
          description: Details of the conversation
          content:
            application/json:
              schema:
                      type: object
                      properties:
                        conversation_id:
                          type: string
                          example: "1"
                        is_group:
                          type: boolean
                          example: true
                        name:
                          type: string
                          example: "Group 1"
                        picture: 
                          type: string
                          example: "https://wasatext.com/pictures/1"
                        messages:
                          type : array # an array of the message ids
                          items:
                            type: string
                            example: "1"
                        participants:
                          type: array
                          items:
                            type: string
                            # example with multiple participants
                            example: "Besugo"
                        last_message:
                          type: object
                          properties:
                            content:
                              type: string
                              example: "Hello!"
                            message_id:
                              type: string
                              example: "1"
                            sender:
                              type: string
                              example: "Besugo"
                            timestamp:
                              type: string
                              example: "2021-01-01T00:00:00Z"

  /conversations/create:
    post:
      tags: ["conversation"]
      description: Create a new conversation
      summary: Create a new conversation
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Convo 1"
                  minLength: 3
                  maxLength: 32
                picture:
                  type: string
                  example: "https://wasatext.com/pictures/1"
                  minLength: 1
                  maxLength: 1000000
                participants:
                  type: array
                  items:
                    type: string
                    example: "Besugo"
                  minItems: 1
                  maxItems: 10
      responses:
        '201':
          description: Conversation created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation_id:
                    type: string
                    example: "abcdef012345"

  /conversations/message:
    post:
      tags: ["message"]
      parameters:
        - name: Authorization
          description: Authorization token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/AuthorizationToken'
      description: Send a new message
      summary: Send a new message
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                conversation_id:
                  type: string
                  example: "1"
                content:
                  type: string
                  example: "Hello!"
                is_forwarded:
                  type: boolean
                  example: false
      responses:
        '201':
          # description: Message sent successfully
          # it returns the message_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_id:
                    $ref: '#/components/schemas/MessageId'
          description: Message sent successfully
    delete:
      tags: ["message"]
      description: Delete a message
      summary: Delete a message
      operationId: deleteMessage
      parameters:
        - name: Authorization
          description: Authorization token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/AuthorizationToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message_id:
                  $ref: '#/components/schemas/MessageId'
      responses:
        '204':
          description: Message deleted successfully

  /conversations/message/info:
    get:
      tags: ["message"]
      description: Retrieve a single message's info.
      summary: Retrieve a single message
      operationId: getMessage
      parameters:
        - name: Authorization
          description: Authorization token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/AuthorizationToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message_id:
                  $ref: '#/components/schemas/MessageId'
      responses:
        '200':
          description: Details of the message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_id:
                    type: string
                    example: "1"
                  conversation_id:
                    type: string
                    example: "1"
                  sender_id:
                    type: string
                    example: "Besugo"
                  content:
                    type: string
                    example: "Hello!"
                  timestamp:
                    type: string
                    example: "2021-01-01T00:00:00Z"
                  is_forwarded:
                    type: boolean
                    example: false

  /conversations/message/forward:
    post:
      tags: ["message"]
      description: Forward a message
      summary: Forward a message
      operationId: forwardMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target_conversation_id:
                  description: The conversation_id of the conversation where the message will be forwarded to.
                  type: string
                  example: "1"
                message_id:
                  $ref: '#/components/schemas/MessageId'
      responses:
        '201':
        # returns the message_id of the forwarded message
        # (it basically re-sends the message with the flag "isForwarded" set on true)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_id:
                    $ref: '#/components/schemas/MessageId'
          description: Message forwarded successfully

  /conversations/message/comment:
    post:
      tags: ["message"]
      description: Comment on a message
      summary: Comment on a message
      operationId: commentMessage
      parameters:
        - name: Authorization
          description: Authorization token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/AuthorizationToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: the object that contains the new comment for a message
              type: object
              properties:
                message_id:
                  $ref: '#/components/schemas/MessageId'
                content:
                  description: A valid comment for a message.
                  maxLength: 1000
                  minLength: 1
                  pattern: "^.*$" # any string. Could also be Emojis. (maybe support for images/gifs?)
                  example: "This is a comment."
                  type: string
      responses:
        '201':
          content:
            application/json:
              example:
                message: "OK"
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: Comment added successfully
    delete:
      tags: ["message"]
      description: Remove comment from a message
      summary: Remove comment from a message
      operationId: uncommentMessage
      parameters:
        - name: Authorization
          description: Authorization token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/AuthorizationToken'
      requestBody:
        required: true
        content:
        # a json containing message_id : "abcdef012345"
          application/json:
            schema:
              type: object
              properties:
                message_id:
                  $ref: '#/components/schemas/MessageId'
      responses:
        '204':
          description: Comment removed successfully
    get:
      tags: ["message"]
      description: Retrieve a single comment's information.
      summary: Retrieve a single comment's information.
      operationId: getComments
      parameters:
        - name: Authorization
          description: Authorization token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/AuthorizationToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message_id:
                  $ref: '#/components/schemas/MessageId'
      responses:
        '200':
          description: List of comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_id:
                    type: string
                    example: "abcdef012345"
                  comments:
                    type: array
                    items:
                      type: object
                      properties:
                        message_id:
                          type: string
                          example: "1"
                        content:
                          type: string
                          example: "This is a comment."
                        timestamp:
                          description: The time the comment was sent.
                          type: string
                          example: "2021-01-01T00:00:00Z"
                        sender:
                          description: The user who sent the comment.
                          type: string
                          example: "Besugo"

  /conversation/message/getcomments:
    get:
      tags: ["message"]
      description: Retrieve all comments from a message
      summary: Retrieve all comments from a message
      operationId: getMessageComments
      parameters:
        - name: Authorization
          description: Authorization token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/AuthorizationToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message_id:
                  $ref: '#/components/schemas/MessageId'
      responses:
        '200':
          description: List of comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  comment_ids:
                    type: array
                    items:
                      type: string
                      example: "1234"
                    minItems: 0
                  sender_ids:
                    type: array
                    items:
                      type: string
                      example: "Besugo"
                    minItems: 0
                  contents:
                    type: array
                    items:
                      type: string
                      example: "This is a comment."
                    minItems: 0
                  timestamps:
                    type: array
                    items:
                      type: string
                      example: "2021-01-01T00:00:00Z"
                    minItems: 0

  /conversations/adduser:
    post:
      tags: ["group"]
      description: Add a user to a group (more generally, to the conversation)
      summary: Add a user to a group
      operationId: addToGroup
      parameters:
        - name: Authorization
          description: Authorization token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/AuthorizationToken'
      requestBody:
        required: true
        content:
        # it should contain the username of the user we want to add.
          application/json:
            schema:
              type: object
              properties:
                conversation_id:
                  $ref: '#/components/schemas/ConversationId'
                username:
                  type: string
                  example: "Besugo"
                  minLength: 3
                  maxLength: 32
      responses:
        '204':
          description: User added to group successfully

  /conversations/kickuser:
    delete:
      tags: ["group"]
      description: Kicks a user from a group (yourself by default)
      summary: Kicks a user from a group (yourself by default)
      operationId: leaveGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                conversation_id:
                  $ref: '#/components/schemas/ConversationId'
                username:
                  type: string
                  example: "Besugo"
                  minLength: 3
                  maxLength: 32
      responses:
        '200':
          content:
            application/json:
              example:
                message: "OK"
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: User left the group successfully

  /conversations/photo:
    put:
      tags: ["group"]
      description: Update group photo
      summary: Update group photo
      operationId: setGroupPhoto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: the object that contains the new photo for a group, and the group_id
              type: object
              properties:
                photo:
                  description: A valid image link for the group photo.
                  type: string
                  minLength: 1
                  maxLength: 1000000
                conversation_id:
                  $ref: '#/components/schemas/ConversationId'
      responses:
        '204':
          description: Group photo updated successfully

  /conversations/name:
    put:
      tags: ["group"]
      description: Update group name
      summary: Update group name
      operationId: setGroupName
      parameters:
        - name: Authorization
          description: Authorization token
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/AuthorizationToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: the object that contains the new name for a group and the group_id
              type: object
              properties:
                  conversation_id:
                    $ref: '#/components/schemas/ConversationId'
                  name:
                    type: string
                    example: "NewName"
                    minLength: 3
                    maxLength: 32
                    pattern: "^[A-Za-z0-9]*$"
      responses:
        '204':
          content:
            application/json:
              example:
                message: "OK"
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: Group name updated successfully

# Security Definitions
components:
  schemas:
    MessageId:
      description: A valid message id
      type: string
      example: "abcdef012345"
      minLength: 12
      maxLength: 128
      pattern: "^[A-Za-z0-9n]*$"
    AuthorizationToken:
      description: A valid Authorization token. "Bearer " + user_id
      type: string
      example: "Bearer abcdef012345"
      minLength: 12
      maxLength: 128
      pattern: "^Bearer [A-Za-z0-9]*$"
    # UserId:
    #   description: A valid user id
    #   type: string
    #   example: "abcdef012345"
    #   minLength: 12
    #   maxLength: 128
    #   pattern: "^[A-Za-z0-9n]*$"
    ConversationId:
      description: A valid conversation ID.
      type: string
      example: "123"
      minLength: 3
      maxLength: 128
      pattern: "^[A-Za-z0-9-]*$"
    ValidName:
      description: the object that contains the new name for a user or group
      type: object
      properties:
        name:
          description: A valid, pattern-checked name for a user or group.
          type: string
          minLength: 3
          maxLength: 16
          pattern: "^[A-Za-z0-9]*$"
          example: "NewName"
    SuccessResponse:
      description: a generic success response for non-get requests.
      type: object
      properties:
        message:
          description: A message indicating the success of the action
          type: string
          example: "OK"
          minLength: 2
          maxLength: 100
          pattern: "^[A-Za-z0-9 ]*$"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: UUID
security:
  - bearerAuth: []
