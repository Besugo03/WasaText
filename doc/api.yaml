# Specifications:
# view specifications.txt

# • setMyUserName
# • getMyConversations
# • getConversation
# • sendMessage
# • forwardMessage
# • commentMessage
# • uncommentMessage
# • deleteMessage
# • addToGroup
# • leaveGroup
# • setGroupName
# • setMyPhoto
# • setGroupPhoto

# setBlahBlahBlah uses PUT because it updates the user's name, group name, user's photo, and group photo.
# this is because the resource is being updated or created at aknown URI.

# try to see wether its better to have the userID in the path or in the body of the request.

openapi: '3.0.2'
info: {
  title: WASAText,
  version: '1.0',
  description: "Sadly missed the opportunity to name it 'Wasapp'.",
  contact: {}
  }
servers:
  - url: https://wasatext.com/v1

tags:
  - name: login
    description: Operations related to user login
  - name: user
    description: Operations related to user management
  - name: conversation
    description: Operations related to conversations
  - name: message
    description: Operations related to messages
  - name: group
    description: Operations related to groups

paths:
  /session:
    post:
      tags: ["login"]
      description : logs in the user.
      summary: User log-in
      operationId: doLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: the object that contains the user's name
              type: object
              properties:
                username:
                  $ref: '#/components/schemas/ValidName'
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
                description: the object that contains the user's token
                type: object
                properties:
                  identifier:
                    $ref: '#/components/schemas/AuthorizationToken'
                example:
                  identifier: "Bearer abcdef012345"

  /user/username:
    put:
      tags: ["user"]
      description: Update user’s name
      summary: Update user’s name
      operationId: setMyUserName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: the object that contains the new name for a user
              properties:
                username:
                  $ref: '#/components/schemas/ValidName'
      responses:
        '200':
          description: Username updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                message: "OK"

  /user/photo:
    put:
      tags: ["user"]
      description: Update user profile photo
      summary: Update user profile photo
      operationId: setMyPhoto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: the object that contains the new photo for a user
              properties:
                photo:
                  $ref: '#/components/schemas/ValidPicture'
      responses:
        '200':
          description: Profile photo updated successfully
          content:
            application/json:
              example:
                message: "OK"
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /conversations:
    get:
      tags: ["conversation"]
      description: Retrieve user's conversations
      summary: Retrieve user's conversations
      operationId: getMyConversations
      responses:
        '200':
          description: List of conversations
          content:
            application/json:
              schema:
                required:
                  - conversations
                description: the object that contains the array of conversation ids
                type: object
                properties:
                  conversations:
                    description: An array of the conversation ids
                    type: array
                    items:
                      $ref: '#/components/schemas/ConversationId'
                    minItems: 0 # 'conversations' can still be empty though
                    maxItems: 999999999
              example:
                conversations: ["1", "2", "3"]

  /conversations/info/{conversationID}:
    get:
      tags: ["conversation"]
      description: Retrieve a single conversation
      summary: Retrieve a single conversation
      operationId: getConversation
      parameters:
        - name: conversationID
          description: ID of the conversation
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ConversationId'
      responses:
        '200':
          description: Details of the conversation
          content:
            application/json:
              schema:
                required:
                  - messages  # Mark the messages array as required
                  - participants  # Mark the participants array as required
                description: the object that contains the conversation's information
                type: object
                properties:
                  conversationId:
                    $ref: '#/components/schemas/ConversationId'
                  isGroup:
                    description: A boolean that indicates if the conversation is a group.
                    type: boolean
                    example: true
                  name:
                    $ref: '#/components/schemas/ValidName'
                  picture: 
                    $ref: '#/components/schemas/ValidPicture'
                  messages:
                    type : array # an array of the message ids
                    description: An array of the message ids
                    minItems: 0
                    maxItems: 999999999
                    items:
                      $ref: '#/components/schemas/MessageOrCommentContents'
                  participants:
                    description: An array of the participants' names.
                    type: array
                    minItems: 1
                    maxItems: 256
                    items:
                      $ref: '#/components/schemas/ValidName'
                    example: ["Besugo", "Pepito"]
                  lastMessage:
                    description: The last message sent in the conversation.
                    type: object
                    properties:
                      content:
                        $ref: '#/components/schemas/MessageOrCommentContents'
                      messageId:
                        $ref: '#/components/schemas/MessageOrCommentId'
                      sender:
                        $ref: '#/components/schemas/ValidName'
                      timestamp:
                        $ref: '#/components/schemas/TimeStamp'
              example:
                conversationId: "1"
                isGroup: true
                name: "Group Name"
                picture: "https://wasatext.com/pictures/1"
                messages: ["Hello!", "Goodbye!"]
                participants: ["Besugo", "Pepito"]
                last_message:
                  content: "Goodbye!"
                  messageId: "abcdef012345"
                  sender: "Besugo"
                  timestamp: "2021-01-01T00:00:00Z"

  /conversations/create:
    post:
      tags: ["conversation"]
      description: Create a new conversation
      summary: Create a new conversation
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: the object that contains the conversation's name, picture, and participants.
              type: object
              properties:
                name:
                  $ref: '#/components/schemas/ValidName'
                picture:
                  $ref: '#/components/schemas/ValidPicture'
                participants:
                  description: An array of the participants' names.
                  type: array
                  items:
                    $ref : '#/components/schemas/ValidName'
                  minItems: 1
                  maxItems: 10
      responses:
        '201':
          description: Conversation created successfully
          content:
            application/json:
              schema:
                description: the object that contains the conversation_id of the conversation created
                type: object
                properties:
                  conversationId:
                    $ref: '#/components/schemas/ConversationId'
                example:
                  conversationId: "1"

  /conversations/message:
    post:
      tags: ["message"]
      description: Send a new message
      summary: Send a new message
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: the object that contains the message for a conversation
              type: object
              properties:
                conversationId:
                  $ref: '#/components/schemas/ConversationId'
                content:
                  $ref: '#/components/schemas/MessageOrCommentContents'
                isForwarded:
                  description: A boolean that indicates if the message was forwarded.
                  type: boolean
                  example: false
      responses:
        '201':
          # description: Message sent successfully
          # it returns the message_id
          content:
            application/json:
              schema:
                description: the object that contains the message_id of the message sent
                type: object
                properties:
                  messageId:
                    $ref: '#/components/schemas/MessageOrCommentId'
                example:
                  messageId: "abcdef012345"
          description: Message sent successfully
    delete:
      tags: ["message"]
      description: Delete a message
      summary: Delete a message
      operationId: deleteMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: the object that contains the message_id of the message to delete.
              type: object
              properties:
                messageId:
                  $ref: '#/components/schemas/MessageOrCommentId'
      responses:
        '204':
          description: Message deleted successfully

  /conversations/message/info:
    get:
      tags: ["message"]
      description: Retrieve a single message's info.
      summary: Retrieve a single message
      operationId: getMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: the object that contains the message_id of the message to retrieve the information from.
              type: object
              properties:
                messageId:
                  $ref: '#/components/schemas/MessageOrCommentId'
      responses:
        '200':
          description: Details of the message
          content:
            application/json:
              schema:
                description: the object that contains the message for a conversation
                type: object
                properties:
                  messageId:
                    $ref: '#/components/schemas/MessageOrCommentId'
                  conversationId:
                    $ref: '#/components/schemas/ConversationId'
                  sender:
                    $ref: '#/components/schemas/ValidName'
                  content:
                    $ref: '#/components/schemas/MessageOrCommentContents'
                  timestamp:
                    $ref: '#/components/schemas/TimeStamp'
                  isForwarded:
                    description: A boolean that indicates if the message was forwarded.
                    type: boolean
                    example: false
                example:
                  messageId: "abcdef012345"
                  conversationId: "1"
                  sender: "Besugo"
                  content: "Hello!"
                  timestamp: "2021-01-01T00:00:00Z"
                  isForwarded: false

  /conversations/message/forward:
    post:
      tags: ["message"]
      description: Forward a message
      summary: Forward a message
      operationId: forwardMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: the object that contains the message_id of the message to forward and the conversation_id of the conversation to forward the message to.
              type: object
              properties:
                targetConversationId:
                  $ref: '#/components/schemas/ConversationId'
                messageId:
                  $ref: '#/components/schemas/MessageOrCommentId'
      responses:
        '201':
        # returns the message_id of the forwarded message
        # (it basically re-sends the message with the flag "isForwarded" set on true)
          content:
            application/json:
              schema:
                description: the object that contains the message_id of the forwarded message
                type: object
                properties:
                  messageId:
                    $ref: '#/components/schemas/MessageOrCommentId'
                example:
                  messageId: "1"
          description: Message forwarded successfully

  /conversations/message/comment:
    post:
      tags: ["message"]
      description: Comment on a message
      summary: Comment on a message
      operationId: commentMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: the object that contains the new comment for a message
              type: object
              properties:
                messageId:
                  $ref: '#/components/schemas/MessageOrCommentId'
                content:
                  description: A valid comment for a message.
                  maxLength: 1000
                  minLength: 1
                  pattern: "^.*$" # any string. Could also be Emojis. (maybe support for images/gifs?)
                  example: "This is a comment."
                  type: string
      responses:
        '201':
          content:
            application/json:
              example:
                message: "OK"
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: Comment added successfully
    delete:
      tags: ["message"]
      description: Remove comment from a message
      summary: Remove comment from a message
      operationId: uncommentMessage
      requestBody:
        required: true
        content:
        # a json containing message_id : "abcdef012345"
          application/json:
            schema:
              description: the object that contains the comment_id of the comment to remove from the message.
              type: object
              properties:
                messageId:
                  $ref: '#/components/schemas/MessageOrCommentId'
      responses:
        '204':
          description: Comment removed successfully
    get:
      tags: ["message"]
      description: Retrieve a single comment's information
      summary: Retrieve a single comment's information
      operationId: getComments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: the object that contains the comment_id of the comment to retrieve the information from.
              type: object
              properties:
                commentId:
                  $ref: '#/components/schemas/MessageOrCommentId'
      responses:
        '200':
          description: List of comments
          content:
            application/json:
              schema:
                description: the object that contains the comment for a message
                type: object
                properties:
                  messageId:
                    $ref: '#/components/schemas/MessageOrCommentId'
                  content:
                    $ref: '#/components/schemas/MessageOrCommentContents'
                  timestamp:
                    $ref: '#/components/schemas/TimeStamp'
                  sender:
                    $ref: '#/components/schemas/ValidName'
                example:
                  messageId: "abcdef012345"
                  content: "Hello!"
                  timestamp: "2021-01-01T00:00:00Z"
                  sender: "Besugo"

  /conversation/message/getcomments:
    get:
      tags: ["message"]
      description: Retrieve all comments from a message
      summary: Retrieve all comments from a message
      operationId: getMessageComments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: the object that contains the message_id of the message to retrieve the comments from.
              type: object
              properties:
                messageId:
                  $ref: '#/components/schemas/MessageOrCommentId'
      responses:
        '200':
          description: List of comments
          content:
            application/json:
              example:
                commentIds: ["1", "2"]
                senderIds: ["abcdef012345", "abcdef012345"]
                contents: ["Hello!", "Hello!"]
                timestamps: ["2021-01-01T00:00:00Z", "2021-01-01T00:00:00Z"]
              schema:
                required:
                  - commentIds
                  - senderIds
                  - contents
                  - timestamps
                description: the object that contains the array of comments for a message
                type: object
                properties:
                  commentIds:
                    description: the array of comment ids for each comment
                    type: array
                    items:
                      $ref: '#/components/schemas/MessageOrCommentId'
                    minItems: 0
                    maxItems: 999999999
                  senderIds:
                    description: the array of sender ids for each comment
                    type: array
                    items:
                      $ref: '#/components/schemas/UserId'
                    minItems: 0
                    maxItems: 999999999
                  contents:
                    description: the array of contents for each comment
                    type: array
                    items:
                      $ref: '#/components/schemas/MessageOrCommentContents'
                    minItems: 0
                    maxItems: 999999999
                  timestamps:
                    description: the array of timestamps for each comment
                    type: array
                    items:
                      type: string
                      description: The time the comment was sent.
                      format: date-time
                      example: "2021-01-01T00:00:00Z"
                      maxLength: 64
                      minLength: 8
                      minItems: 0
                    maxItems: 999999999
                    minItems: 0

  /conversations/adduser:
    post:
      tags: ["group"]
      description: Add a user to a group (more generally, to the conversation)
      summary: Add a user to a group
      operationId: addToGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: the object that contains the user to be added to the group and the group_id of which the user will be added to.
              type: object
              properties:
                conversationId:
                  $ref: '#/components/schemas/ConversationId'
                username:
                  $ref: '#/components/schemas/ValidName'
      responses:
        '204':
          description: User added to group successfully

  /conversations/kickuser:
    put:
      tags: ["group"]
      description: Kicks a user from a group (yourself by default)
      summary: Kicks a user from a group (yourself by default)
      operationId: leaveGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: the object that contains the user to be kicked from the group and the group_id of which the user will be kicked from.
              type: object
              properties:
                conversationId:
                  $ref: '#/components/schemas/ConversationId'
                username:
                  $ref: '#/components/schemas/ValidName'
      responses:
        '200':
          content:
            application/json:
              example:
                message: "OK"
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: User left the group successfully

  /conversations/photo:
    put:
      tags: ["group"]
      description: Update group photo
      summary: Update group photo
      operationId: setGroupPhoto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: the object that contains the new photo for a group, and the group_id
              type: object
              properties:
                photo:
                  description: A valid image link for the group photo.
                  type: string
                  minLength: 1
                  maxLength: 1000000
                  pattern : "^.*$"
                conversationId:
                  $ref: '#/components/schemas/ConversationId'
      responses:
        '200':
          content:
            application/json:
              example:
                message: "OK"
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: Group photo updated successfully

  /conversations/name:
    put:
      tags: ["group"]
      description: Update group name
      summary: Update group name
      # operationID verb should be "replace", as of ibm-operationid-naming-convention. 
      # But the professor wanted this name.
      operationId: setGroupName 
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: the object that contains the new name for a group and the group_id
              type: object
              properties:
                  conversationId:
                    $ref: '#/components/schemas/ConversationId'
                  name:
                    $ref: '#/components/schemas/ValidName'
      responses:
        '201':
          content:
            application/json:
              example:
                message: "OK"
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: Group name updated successfully

# Security Definitions
components:
  schemas:
    MessageOrCommentId:
      description: A valid message id
      type: string
      example: "abcdef012345"
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9n]*$"
    MessageOrCommentContents:
      description: A valid message or comment content
      type: string
      example: "Hello!"
      minLength: 1
      maxLength: 100000
      pattern: "^.*$" # any string. Could also be Emojis. (maybe support for images/gifs?)
    AuthorizationToken:
      description: A valid Authorization token. "Bearer " + user_id
      type: string
      example: "Bearer abcdef012345"
      minLength: 1
      maxLength: 128
      pattern: "^Bearer [A-Za-z0-9]*$"
    UserId:
      description: A valid user id
      type: string
      example: "abcdef012345"
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9n]*$"
    ConversationId:
      description: A valid conversation ID.
      type: string
      example: "123"
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9-]*$"
    ValidName:
        description: A valid, pattern-checked name for a user or group.
        type: string
        minLength: 1
        maxLength: 32
        # need the pattern to satisfy the IBM lords.
        pattern: "^.*$" # any string. Could also be Emojis. (maybe support for images/gifs?)
        example: "Username"
    ValidPicture:
        description: A valid image link for a user or group photo.
        type: string
        minLength: 1
        maxLength: 1000000
        pattern: "^.*$"
        example: "https://wasatext.com/pictures/1"
    TimeStamp:
      description: A valid timestamp
      type: string
      format: date-time
      example: "2021-01-01T00:00:00Z"
      minLength: 8
      maxLength: 64
    # The most useless schema ever. Made just to satisfy the IBM-openapi ruleset.
    # Lots of responses could've been 204s but I had to make them 200s because of this.
    # PUT operations, as of the rfc, could return 204s, but oh well.
    # https://www.rfc-editor.org/rfc/rfc9110.html#section-9.3.4
    SuccessResponse:
      description: a generic success response for non-get requests.
      type: object
      properties:
        message:
          description: A message indicating the success of the action
          type: string
          example: "OK"
          minLength: 2
          maxLength: 100
          pattern: "^[A-Za-z0-9 ]*$"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: UUID
security:
  - bearerAuth: []
